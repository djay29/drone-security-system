# Application Settings Configuration

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/drone-security.log"

detection:
  yolo_model: "yolov8s"
  confidence_threshold: 0.4
  
memory:
  sqlite_path: "data/security_memory.db"
  chroma_collection: "security-events"
  retention_days: 30
  
alerts:
  channels:
    - type: "email"
      enabled: false
      recipients: []
    - type: "webhook"
      enabled: false
      url: ""
    - type: "console"
      enabled: true

dashboard:
  port: 8501
  host: "0.0.0.0"
  auto_reload: true
  
simulator:
  enabled: true
  event_rate: 1.0  # events per second
